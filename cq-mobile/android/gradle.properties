# Heap kept modest so the Gradle daemon fits alongside Elasticsearch/Docker,
# Android Studio, the IDE, etc. 8G+4G here caused an OS out-of-memory crash of
# the daemon on a 16 GB machine. 3 GB is plenty to build this app.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# One worker keeps peak memory down on constrained machines.
org.gradle.workers.max=2
