name: cq_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cached_network_image: ^3.4.1
  cookie_jar: ^4.0.9
  dio: ^5.10.0
  dio_cookie_manager: ^3.4.0
  file_picker: ^11.0.0
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.0
  go_router: ^17.3.0
  google_fonts: ^8.2.0
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo/
    # Inter, bundled. google_fonts prefers a matching asset over its HTTP
    # fetch, so the app no longer downloads its typeface on first launch — a
    # slow or offline first run used to render the whole product in the
    # platform fallback font. Filenames must stay in the Google Fonts API form
    # (Inter-Regular / Medium / SemiBold / Bold) for that matching to work.
    - google_fonts/

# App launcher icon — bold navy tile + white CQ mark (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  min_sdk_android: 21

# Native splash — SOLID brand navy (#192249), no logo (blank transparent image).
# The animated Dart splash then paints EVERYTHING on that same navy: the network
# fades in, the CQ letters appear, and the cyan arrow flies in from the left to
# complete the mark. Native navy → Dart navy = one continuous splash (the reveal
# happens once, in Dart — never a separate native logo → "two splashes").
# (run: dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#192249"
  image: assets/icon/blank.png
  android_12:
    image: assets/icon/blank.png
    icon_background_color: "#192249"
  android: true
  ios: true
